services:
  # PostgreSQL + pgvector
  # 반드시 pgvector/pgvector:pg16 사용 (일반 postgres:16 사용 금지)
  postgres:
    image: pgvector/pgvector:pg16
    container_name: tripick-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tripick
      POSTGRES_PASSWORD: tripick
      POSTGRES_DB: tripick
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripick -d tripick"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (캐시·세션·BullMQ 잡 큐)
  redis:
    image: redis:7-alpine
    container_name: tripick-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO (Object Storage — S3 호환, 로컬 개발용)
  # 라이브: STORAGE_ENDPOINT만 Cloudflare R2로 전환
  minio:
    image: minio/minio:latest
    container_name: tripick-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Mailpit (SMTP catcher — 로컬에서 보낸 메일을 웹 UI 에서 확인)
  # 라이브: SMTP_HOST 만 Resend/SendGrid SMTP 로 전환
  mailpit:
    image: axllent/mailpit:latest
    container_name: tripick-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  # OpenTripPlanner 2 — GTFS(대중교통) + OSM(자동차/도보) 통합 길찾기 서버
  # 별도 테스트용. profile 로 분리되어 기본 `docker compose up` 에는 포함되지 않는다.
  #   1) 그래프 빌드 (최초 1회 / 데이터 교체 시):
  #        docker compose --profile otp-build up otp-build
  #   2) 서버 기동:
  #        docker compose --profile otp up -d otp
  # 데이터·설정 파일은 infra/otp/data 에 두면 컨테이너의 /var/opentripplanner 로 마운트된다.
  otp-build:
    image: opentripplanner/opentripplanner:2.9.0
    container_name: tripick-otp-build
    profiles: ["otp-build"]
    environment:
      # 전국 GTFS+OSM 빌드는 stop_times 매핑 피크 때문에 13g 필요(8g는 OOM).
      # 권역만 빌드하면 OTP_MAX_HEAP 로 낮춘다.
      JAVA_TOOL_OPTIONS: "-Xmx${OTP_MAX_HEAP:-13g}"
    volumes:
      - ./infra/otp/data:/var/opentripplanner
    command: ["--build", "--save"]
    restart: "no"

  otp:
    image: opentripplanner/opentripplanner:2.9.0
    container_name: tripick-otp
    profiles: ["otp"]
    restart: unless-stopped
    environment:
      # 전국 그래프(graph.obj 1.3GB) 로딩 + Raptor 인덱스 서빙에 10g 상주(실측 ~10.6GiB).
      # 권역만 서빙하면 낮춰도 된다.
      JAVA_TOOL_OPTIONS: "-Xmx${OTP_MAX_HEAP:-10g}"
    ports:
      - "8090:8080"   # 호스트 8090 → 컨테이너 8080 (LLM 서버와 포트 충돌 회피)
    volumes:
      - ./infra/otp/data:/var/opentripplanner
    command: ["--load", "--serve"]

  # MinIO 버킷 초기화
  minio-init:
    image: minio/mc:latest
    container_name: tripick-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin;
        mc mb --ignore-existing local/tripick;
        mc anonymous set download local/tripick/public;
        echo 'MinIO bucket initialized';
      "
    restart: "no"

volumes:
  postgres_data:
  redis_data:
  minio_data:
