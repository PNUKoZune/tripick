services:
  # PostgreSQL + pgvector
  # 반드시 pgvector/pgvector:pg16 사용 (일반 postgres:16 사용 금지)
  postgres:
    image: pgvector/pgvector:pg16
    container_name: tripick-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tripick
      POSTGRES_PASSWORD: tripick
      POSTGRES_DB: tripick
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripick -d tripick"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (캐시·세션·BullMQ 잡 큐)
  redis:
    image: redis:7-alpine
    container_name: tripick-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO (Object Storage — S3 호환, 로컬 개발용)
  # 라이브: STORAGE_ENDPOINT만 Cloudflare R2로 전환
  minio:
    image: minio/minio:latest
    container_name: tripick-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO 버킷 초기화
  minio-init:
    image: minio/mc:latest
    container_name: tripick-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin;
        mc mb --ignore-existing local/tripick;
        mc anonymous set download local/tripick/public;
        echo 'MinIO bucket initialized';
      "
    restart: "no"

volumes:
  postgres_data:
  redis_data:
  minio_data:
