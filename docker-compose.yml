# 로컬 개발 인프라. **포트는 전부 127.0.0.1 에만 바인딩한다** —
# `"5432:5432"` 는 0.0.0.0 바인딩이라 같은 네트워크(카페·회사 와이파이, WSL 호스트의 다른
# 기기)의 누구나 접속할 수 있고, 여기 자격증명은 tripick/tripick·minioadmin 이고 Redis 는
# 비밀번호가 아예 없다. 즉 DB·객체 스토리지·잡 큐가 그대로 열린다.
# API·웹은 같은 호스트에서 돌므로 루프백으로 충분하다. 다른 기기에서 붙여야 할 때만
# 그 포트를 일시적으로 열고, 열어 둔 채 커밋하지 말 것.
services:
  # PostgreSQL + pgvector
  # 반드시 pgvector/pgvector:pg16 사용 (일반 postgres:16 사용 금지)
  postgres:
    image: pgvector/pgvector:pg16
    container_name: tripick-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tripick
      POSTGRES_PASSWORD: tripick
      POSTGRES_DB: tripick
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripick -d tripick"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (캐시·세션·BullMQ 잡 큐)
  redis:
    image: redis:7-alpine
    container_name: tripick-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO (Object Storage — S3 호환, 로컬 개발용)
  # 라이브: STORAGE_ENDPOINT만 Cloudflare R2로 전환
  minio:
    image: minio/minio:latest
    container_name: tripick-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # Web Console
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Mailpit (SMTP catcher — 로컬에서 보낸 메일을 웹 UI 에서 확인)
  # 라이브: SMTP_HOST 만 Resend/SendGrid SMTP 로 전환
  mailpit:
    image: axllent/mailpit:latest
    container_name: tripick-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"   # SMTP
      - "127.0.0.1:8025:8025"   # Web UI
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  # MinIO 버킷 초기화
  minio-init:
    image: minio/mc:latest
    container_name: tripick-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin;
        mc mb --ignore-existing local/tripick;
        mc anonymous set download local/tripick/public;
        echo 'MinIO bucket initialized';
      "
    restart: "no"

volumes:
  postgres_data:
  redis_data:
  minio_data:
